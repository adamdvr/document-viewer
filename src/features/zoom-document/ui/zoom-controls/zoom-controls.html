<button
  type="button"
  appIconButton
  [icon]="IconName.Minus"
  label="Уменьшить масштаб"
  [disabled]="!zoom.canZoomOut()"
  (click)="zoom.zoomOut()"
></button>

<button
  type="button"
  class="reset"
  title="Сбросить масштаб"
  attr.aria-label="Сбросить масштаб, сейчас {{ zoom.percent() }} %"
  (click)="zoom.reset()"
>
  {{ zoom.percent() }}%
</button>

<button
  type="button"
  appIconButton
  [icon]="IconName.Plus"
  label="Увеличить масштаб"
  [disabled]="!zoom.canZoomIn()"
  (click)="zoom.zoomIn()"
></button>
